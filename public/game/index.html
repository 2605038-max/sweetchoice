<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sweet Run - 3D Candy Endless Runner | Sweet Choice</title>
  <meta name="description" content="Sweet Run - 3D Candy Endless Runner by Sweet Choice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./dist/assets/index-D0Zo_R6P.js"></script>
  <link rel="stylesheet" crossorigin href="./dist/assets/index-B5D_26jb.css">
  <style>
    /* Unified Top Bar for Standalone Free-Play Mode */
    .game-top-bar {
      position: fixed;
      top: 74px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }
    .game-top-bar > * { pointer-events: auto; }
    body.checkout-mode .game-top-bar { display: none !important; }

    .back-to-shop-btn {
      background: rgba(255, 252, 248, 0.95);
      color: #604638;
      border: 1.5px solid #E8DDD0;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(96, 70, 56, 0.14);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .back-to-shop-btn:hover {
      background: #A66F55;
      color: #FFFFFF;
      border-color: #A66F55;
      transform: translateY(-1px);
    }

    .freeplay-pill {
      background: rgba(255, 255, 255, 0.94);
      color: #705346;
      border: 1.5px solid #E8C1C7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(61, 38, 29, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      white-space: nowrap;
    }

    /* In-Game >2,000 Point Milestone Celebration Banner (Checkout Mode) */
    .milestone-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      background: linear-gradient(135deg, #C47C85 0%, #D98A6C 100%);
      color: #FFFFFF;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.02rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(196, 124, 133, 0.45);
      z-index: 999999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-family: 'Fredoka', 'Noto Sans JP', sans-serif;
      border: 2px solid #FFFFFF;
      white-space: nowrap;
    }
    .milestone-banner.active {
      transform: translateX(-50%) translateY(0);
    }

    /* In checkout mode, parent checkout controller manages starts/restarts & ads */
    body.checkout-mode #restart-btn,
    body.checkout-mode #pause-restart-btn {
      display: none !important;
    }
    body.checkout-mode.awaiting-authorization #start-btn {
      opacity: 0.55;
      pointer-events: none;
    }

    .checkout-gameover-note {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #FAF6F0;
      border: 1.5px solid #E8C1C7;
      color: #3D261D;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      line-height: 1.5;
    }
    .checkout-gameover-note.is-win {
      background: #EDF9EA;
      border-color: #7BC676;
      color: #265B1D;
    }

    /* Mini Game Start Screen Promotional Reward Banner (Auto-localized EN / JA) */
    #start-screen .card {
      padding: 26px 34px !important;
      max-width: 470px !important;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    #start-screen .subtitle {
      margin-bottom: 14px !important;
    }
    #start-screen .character-picker {
      margin-bottom: 12px !important;
    }
    #start-screen .instructions-box {
      padding: 12px 14px !important;
      margin-bottom: 16px !important;
    }

    .promo-reward-banner {
      background: linear-gradient(135deg, #fff5f8 0%, #fff8ec 100%);
      border: 2px solid #ff8fb1;
      border-radius: 18px;
      padding: 13px 16px;
      margin-bottom: 14px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(255, 51, 102, 0.14);
      font-family: 'Fredoka', 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }
    .promo-reward-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ff2a63;
      letter-spacing: 0.4px;
      margin-bottom: 7px;
      line-height: 1.3;
    }
    .promo-reward-line {
      font-size: 0.88rem;
      font-weight: 600;
      color: #5c3742;
      line-height: 1.5;
      margin: 4px 0;
    }
    .promo-reward-highlight {
      color: #d61f54;
      font-weight: 800;
      background: #ffe3ec;
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .game-top-bar { top: 68px; left: 10px; right: 10px; }
      .back-to-shop-btn, .freeplay-pill { font-size: 0.72rem; padding: 5px 10px; }
      #start-screen .card { padding: 20px 18px !important; }
      .promo-reward-banner { padding: 11px 12px; }
      .promo-reward-title { font-size: 0.96rem; }
      .promo-reward-line { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Standalone Mode Top Bar (Hidden when embedded in Checkout Mode) -->
  <div class="game-top-bar">
    <a href="../index.php" class="back-to-shop-btn" id="standalone-back-btn">
      <span>🏪</span>
      <span id="standalone-back-label">ショップへ戻る</span>
    </a>
    <span class="freeplay-pill" id="standalone-freeplay-pill">
      <span>🎮</span>
      <span id="standalone-freeplay-label">フリープレイモード（エンタメ専用）</span>
    </span>
  </div>

  <!-- Checkout Mode >2,000 Milestone Banner -->
  <div id="milestone-banner" class="milestone-banner">
    <span>🎉</span>
    <span id="milestone-text">2,000点突破！¥200割引ライン達成！</span>
  </div>

  <!-- Existing 3D Sweet Run React Root & Three.js Canvas -->
  <div id="root"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const isCheckoutMode = params.get('mode') === 'checkout';

      const PROMO_COPY = {
        en: {
          title: '🎁 SPECIAL REWARD!',
          line1Html: 'Spend <strong class="promo-reward-highlight">¥3,000 or more</strong> and unlock <strong class="promo-reward-highlight">3 game attempts</strong>!',
          line2Html: 'Score <strong class="promo-reward-highlight">2,000 points or higher</strong> to receive <strong class="promo-reward-highlight">¥200 OFF</strong> your order!',
          backLabel: 'Back to Shop',
          freeplayLabel: 'FREE PLAY MODE (Entertainment Only)',
          milestoneText: 'Over 2,000 pts! ¥200 Discount Goal Reached!'
        },
        ja: {
          title: '🎁 特別キャンペーン！',
          line1Html: '<strong class="promo-reward-highlight">3,000円以上</strong>ご購入いただくと、ゲームに<strong class="promo-reward-highlight">3回</strong>挑戦できます！',
          line2Html: '<strong class="promo-reward-highlight">2,000ポイント以上</strong>を獲得すると、ご注文金額から<strong class="promo-reward-highlight">200円割引</strong>！',
          backLabel: 'ショップへ戻る',
          freeplayLabel: 'フリープレイモード（エンタメ専用）',
          milestoneText: '2,000点突破！¥200割引ライン達成！'
        }
      };

      function getCookieLang() {
        const match = document.cookie.match(/(?:^|;\s*)sweetchoice_lang=(en|ja)(?:;|$)/);
        return match ? match[1] : null;
      }

      function getStorageLang() {
        try {
          const val = localStorage.getItem('sweetchoice_lang');
          return (val === 'en' || val === 'ja') ? val : null;
        } catch (e) {
          return null;
        }
      }

      function getQueryLang() {
        const q = params.get('lang');
        return (q === 'en' || q === 'ja') ? q : null;
      }

      // Automatic initial language detection following website's selected language
      // Priority: website cookie (live site setting) -> URL query param -> localStorage -> default 'ja'
      // Note: if explicit ?lang= is provided and no website cookie is set yet, ?lang= is respected.
      let lang = getCookieLang() || getQueryLang() || getStorageLang() || 'ja';

      function buildPromoBannerElement(activeLang) {
        const copy = PROMO_COPY[activeLang] || PROMO_COPY.ja;
        const banner = document.createElement('div');
        banner.id = 'start-promo-banner';
        banner.className = 'promo-reward-banner';
        banner.setAttribute('data-lang', activeLang);
        banner.innerHTML =
          '<div class="promo-reward-title">' + copy.title + '</div>' +
          '<p class="promo-reward-line">' + copy.line1Html + '</p>' +
          '<p class="promo-reward-line">' + copy.line2Html + '</p>';
        return banner;
      }

      function renderStartScreenPromo(activeLang) {
        const card = document.querySelector('#start-screen .card');
        if (!card) return false;

        const copy = PROMO_COPY[activeLang] || PROMO_COPY.ja;
        let banner = document.getElementById('start-promo-banner');
        if (!banner) {
          banner = buildPromoBannerElement(activeLang);
          const subtitle = card.querySelector('.subtitle');
          const picker = card.querySelector('.character-picker');
          if (subtitle && subtitle.nextSibling) {
            card.insertBefore(banner, subtitle.nextSibling);
          } else if (picker) {
            card.insertBefore(banner, picker);
          } else {
            card.insertBefore(banner, card.firstChild);
          }
        } else {
          banner.setAttribute('data-lang', activeLang);
          const titleEl = banner.querySelector('.promo-reward-title');
          const lines = banner.querySelectorAll('.promo-reward-line');
          if (titleEl) titleEl.textContent = copy.title;
          if (lines[0]) lines[0].innerHTML = copy.line1Html;
          if (lines[1]) lines[1].innerHTML = copy.line2Html;
        }
        return true;
      }

      function applyLanguage(newLang) {
        if (newLang !== 'en' && newLang !== 'ja') return;
        lang = newLang;
        document.documentElement.lang = lang;

        const copy = PROMO_COPY[lang];
        const backLabel = document.getElementById('standalone-back-label');
        const freeplayLabel = document.getElementById('standalone-freeplay-label');
        const milestoneText = document.getElementById('milestone-text');
        if (backLabel) backLabel.textContent = copy.backLabel;
        if (freeplayLabel) freeplayLabel.textContent = copy.freeplayLabel;
        if (milestoneText) milestoneText.textContent = copy.milestoneText;

        renderStartScreenPromo(lang);
      }

      async function syncLanguageFromWebsite(allowQueryFallback) {
        try {
          const res = await fetch('../api/language.php', {
            credentials: 'same-origin',
            cache: 'no-store'
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data && (data.lang === 'en' || data.lang === 'ja')) {
            const qLang = getQueryLang();
            // Follow website's active language; only honor URL ?lang= when website has no explicit language stored yet
            const resolved = (!data.explicit && allowQueryFallback && qLang) ? qLang : data.lang;
            applyLanguage(resolved);
          }
        } catch (e) {
          // Offline / non-PHP fallback: rely on cookie / query / localStorage already applied
          const fallbackLang = getCookieLang() || getStorageLang() || getQueryLang();
          if (fallbackLang) applyLanguage(fallbackLang);
        }
      }

      // Apply immediately and observe React mount of #start-screen .card
      applyLanguage(lang);
      const rootEl = document.getElementById('root');
      if (rootEl && !renderStartScreenPromo(lang)) {
        const observer = new MutationObserver(() => {
          if (renderStartScreenPromo(lang)) {
            observer.disconnect();
          }
        });
        observer.observe(rootEl, { childList: true, subtree: true });
      }

      // Verify against live website PHP session language immediately
      syncLanguageFromWebsite(true);

      // Automatically update if customer switches language on the website in another tab or navigates back
      window.addEventListener('storage', (e) => {
        if (e.key === 'sweetchoice_lang' && (e.newValue === 'en' || e.newValue === 'ja')) {
          applyLanguage(e.newValue);
        }
      });
      window.addEventListener('focus', () => syncLanguageFromWebsite(true));
      window.addEventListener('pageshow', () => syncLanguageFromWebsite(true));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          syncLanguageFromWebsite(true);
        }
      });

      if (!isCheckoutMode) {
        // Standalone Entertainment Mode: no checkout rewards, no checkout attempts consumed.
        return;
      }

      // =========================================================================
      // CHECKOUT EMBEDDED MODE BRIDGE (Same-origin postMessage with checkout-game.php)
      // =========================================================================
      document.body.classList.add('checkout-mode', 'awaiting-authorization');

      let attemptAuthorized = false;
      let roundActive = false;
      let gameOverReported = false;
      let milestoneShown = false;

      function notifyParent(type, data) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(Object.assign({ type: type }, data || {}), window.location.origin);
        }
      }

      function triggerGameStartProgrammatically() {
        attemptAuthorized = true;
        roundActive = true;
        gameOverReported = false;
        milestoneShown = false;
        document.body.classList.remove('awaiting-authorization');

        const oldNote = document.getElementById('checkout-gameover-note');
        if (oldNote) oldNote.remove();

        // Click either #restart-btn (if on game over) or #start-btn (if on start screen)
        const gameOverScreen = document.getElementById('game-over-screen');
        const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');
        const restartBtn = document.getElementById('restart-btn');
        const startBtn = document.getElementById('start-btn');

        if (isGameOver && restartBtn) {
          restartBtn.click();
        } else if (startBtn) {
          startBtn.click();
        }
      }

      // Listen for commands from parent checkout-game.js
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        const msg = event.data || {};

        if (msg.type === 'sweetrun:authorize_and_start') {
          triggerGameStartProgrammatically();
        } else if (msg.type === 'sweetrun:lock') {
          attemptAuthorized = false;
          roundActive = false;
          document.body.classList.add('awaiting-authorization');
        }
      });

      // Block unauthorized Space/Enter restarts on Start or Game Over screens in checkout mode
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          const startScreen = document.getElementById('start-screen');
          const gameOverScreen = document.getElementById('game-over-screen');
          const isStart = startScreen && !startScreen.classList.contains('hidden');
          const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');

          if ((isStart || isGameOver) && !attemptAuthorized) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }
      }, true);

      // Intercept direct clicks on #start-btn when not yet authorized -> ask parent to start attempt
      document.addEventListener('click', (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('#start-btn') : null;
        if (btn && !attemptAuthorized) {
          e.preventDefault();
          e.stopImmediatePropagation();
          notifyParent('sweetrun:request_start', {});
        }
      }, true);

      // Poll live score & game-over state cleanly
      setInterval(() => {
        const scoreEl = document.getElementById('score-val');
        const currentScore = scoreEl ? (parseInt(scoreEl.textContent, 10) || 0) : 0;

        if (roundActive && currentScore > 2000 && !milestoneShown) {
          milestoneShown = true;
          const banner = document.getElementById('milestone-banner');
          if (banner) {
            banner.classList.add('active');
            setTimeout(() => banner.classList.remove('active'), 3500);
          }
        }

        const gameOverScreen = document.getElementById('game-over-screen');
        const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');

        if (isGameOver && roundActive && !gameOverReported) {
          gameOverReported = true;
          roundActive = false;
          attemptAuthorized = false;
          document.body.classList.add('awaiting-authorization');

          const finalScoreEl = document.getElementById('final-score-val');
          const finalScore = finalScoreEl ? (parseInt(finalScoreEl.textContent, 10) || 0) : currentScore;

          // Inject concise note inside game-over card directing user to checkout panel controls
          const card = document.querySelector('#game-over-screen .card');
          if (card && !document.getElementById('checkout-gameover-note')) {
            const note = document.createElement('div');
            note.id = 'checkout-gameover-note';
            const won = finalScore > 2000;
            note.className = 'checkout-gameover-note' + (won ? ' is-win' : '');
            if (lang === 'en') {
              note.textContent = won
                ? 'Score over 2,000 achieved! Your ¥200 discount is being recorded below.'
                : 'Round finished! Check the panel below to watch a demo ad for another try or continue to payment.';
            } else {
              note.textContent = won
                ? '2,000点超え達成！下のパネルで200円割引が記録されます。'
                : '挑戦終了！下のパネルからデモ広告を見て再挑戦するか、お支払い設定へお進みください。';
            }
            card.appendChild(note);
          }

          notifyParent('sweetrun:game_over', { score: finalScore });
        }
      }, 250);

      // Signal readiness once React root mounts #start-btn
      const readyCheck = setInterval(() => {
        if (document.getElementById('start-btn')) {
          clearInterval(readyCheck);
          notifyParent('sweetrun:ready', {});
        }
      }, 200);
    })();
  </script>

</body>
</html>
