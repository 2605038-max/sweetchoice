<head>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./dist/assets/index-D0Zo_R6P.js"></script>
  <link rel="stylesheet" crossorigin href="./dist/assets/index-B5D_26jb.css">
  <style>
    /* Unified Top Bar for Standalone Free-Play Mode */
    .game-top-bar {
      position: fixed;
      top: 74px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }
    .game-top-bar > * { pointer-events: auto; }
    body.checkout-mode .game-top-bar { display: none !important; }

    .back-to-shop-btn {
      background: rgba(255, 252, 248, 0.95);
      color: #604638;
      border: 1.5px solid #E8DDD0;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(96, 70, 56, 0.14);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .back-to-shop-btn:hover {
      background: #A66F55;
      color: #FFFFFF;
      border-color: #A66F55;
      transform: translateY(-1px);
    }

    .freeplay-pill {
      background: rgba(255, 255, 255, 0.94);
      color: #705346;
      border: 1.5px solid #E8C1C7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(61, 38, 29, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      white-space: nowrap;
    }

    /* In-Game >2,000 Point Milestone Celebration Banner (Checkout Mode) */
    .milestone-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      background: linear-gradient(135deg, #C47C85 0%, #D98A6C 100%);
      color: #FFFFFF;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.02rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(196, 124, 133, 0.45);
      z-index: 999999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-family: 'Fredoka', 'Noto Sans JP', sans-serif;
      border: 2px solid #FFFFFF;
      white-space: nowrap;
    }
    .milestone-banner.active {
      transform: translateX(-50%) translateY(0);
    }

    /* In checkout mode, parent checkout controller manages starts/restarts & ads */
    body.checkout-mode #restart-btn,
    body.checkout-mode #pause-restart-btn {
      display: none !important;
    }
    body.checkout-mode.awaiting-authorization #start-btn {
      opacity: 0.55;
      pointer-events: none;
    }

    .checkout-gameover-note {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #FAF6F0;
      border: 1.5px solid #E8C1C7;
      color: #3D261D;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      line-height: 1.5;
    }
    .checkout-gameover-note.is-win {
      background: #EDF9EA;
      border-color: #7BC676;
      color: #265B1D;
    }

    @media (max-width: 480px) {
      .game-top-bar { top: 68px; left: 10px; right: 10px; }
      .back-to-shop-btn, .freeplay-pill { font-size: 0.72rem; padding: 5px 10px; }
    }
  </style>
</head>
<body>

  <!-- Standalone Mode Top Bar (Hidden when embedded in Checkout Mode) -->
  <div class="game-top-bar">
    <a href="../index.php" class="back-to-shop-btn" id="standalone-back-btn">
      <span>🏪</span>
      <span id="standalone-back-label">ショップへ戻る</span>
    </a>
    <span class="freeplay-pill" id="standalone-freeplay-pill">
      <span>🎮</span>
      <span id="standalone-freeplay-label">フリープレイモード（エンタメ専用）</span>
    </span>
  </div>

  <!-- Checkout Mode >2,000 Milestone Banner -->
  <div id="milestone-banner" class="milestone-banner">
    <span>🎉</span>
    <span id="milestone-text">2,000点突破！¥200割引ライン達成！</span>
  </div>

  <!-- Existing 3D Sweet Run React Root & Three.js Canvas -->
  <div id="root"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const isCheckoutMode = params.get('mode') === 'checkout';
      const lang = params.get('lang') === 'en' ? 'en' : 'ja';

      document.documentElement.lang = lang;

      // Apply bilingual standalone labels
      const backLabel = document.getElementById('standalone-back-label');
      const freeplayLabel = document.getElementById('standalone-freeplay-label');
      const milestoneText = document.getElementById('milestone-text');
      if (lang === 'en') {
        if (backLabel) backLabel.textContent = 'Back to Shop';
        if (freeplayLabel) freeplayLabel.textContent = 'FREE PLAY MODE (Entertainment Only)';
        if (milestoneText) milestoneText.textContent = 'Over 2,000 pts! ¥200 Discount Goal Reached!';
      }

      if (!isCheckoutMode) {
        // Standalone Entertainment Mode: no checkout rewards, no checkout attempts consumed.
        return;
      }

      // =========================================================================
      // CHECKOUT EMBEDDED MODE BRIDGE (Same-origin postMessage with checkout-game.php)
      // =========================================================================
      document.body.classList.add('checkout-mode', 'awaiting-authorization');

      let attemptAuthorized = false;
      let roundActive = false;
      let gameOverReported = false;
      let milestoneShown = false;

      function notifyParent(type, data) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(Object.assign({ type: type }, data || {}), window.location.origin);
        }
      }

      function triggerGameStartProgrammatically() {
        attemptAuthorized = true;
        roundActive = true;
        gameOverReported = false;
        milestoneShown = false;
        document.body.classList.remove('awaiting-authorization');

        const oldNote = document.getElementById('checkout-gameover-note');
        if (oldNote) oldNote.remove();

        // Click either #restart-btn (if on game over) or #start-btn (if on start screen)
        const gameOverScreen = document.getElementById('game-over-screen');
        const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');
        const restartBtn = document.getElementById('restart-btn');
        const startBtn = document.getElementById('start-btn');

        if (isGameOver && restartBtn) {
          restartBtn.click();
        } else if (startBtn) {
          startBtn.click();
        }
      }

      // Listen for commands from parent checkout-game.js
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        const msg = event.data || {};

        if (msg.type === 'sweetrun:authorize_and_start') {
          triggerGameStartProgrammatically();
        } else if (msg.type === 'sweetrun:lock') {
          attemptAuthorized = false;
          roundActive = false;
          document.body.classList.add('awaiting-authorization');
        }
      });

      // Block unauthorized Space/Enter restarts on Start or Game Over screens in checkout mode
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          const startScreen = document.getElementById('start-screen');
          const gameOverScreen = document.getElementById('game-over-screen');
          const isStart = startScreen && !startScreen.classList.contains('hidden');
          const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');

          if ((isStart || isGameOver) && !attemptAuthorized) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }
      }, true);

      // Intercept direct clicks on #start-btn when not yet authorized -> ask parent to start attempt
      document.addEventListener('click', (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('#start-btn') : null;
        if (btn && !attemptAuthorized) {
          e.preventDefault();
          e.stopImmediatePropagation();
          notifyParent('sweetrun:request_start', {});
        }
      }, true);

      // Poll live score & game-over state cleanly
      setInterval(() => {
        const scoreEl = document.getElementById('score-val');
        const currentScore = scoreEl ? (parseInt(scoreEl.textContent, 10) || 0) : 0;

        if (roundActive && currentScore > 2000 && !milestoneShown) {
          milestoneShown = true;
          const banner = document.getElementById('milestone-banner');
          if (banner) {
            banner.classList.add('active');
            setTimeout(() => banner.classList.remove('active'), 3500);
          }
        }

        const gameOverScreen = document.getElementById('game-over-screen');
        const isGameOver = gameOverScreen && !gameOverScreen.classList.contains('hidden');

        if (isGameOver && roundActive && !gameOverReported) {
          gameOverReported = true;
          roundActive = false;
          attemptAuthorized = false;
          document.body.classList.add('awaiting-authorization');

          const finalScoreEl = document.getElementById('final-score-val');
          const finalScore = finalScoreEl ? (parseInt(finalScoreEl.textContent, 10) || 0) : currentScore;

          // Inject concise note inside game-over card directing user to checkout panel controls
          const card = document.querySelector('#game-over-screen .card');
          if (card && !document.getElementById('checkout-gameover-note')) {
            const note = document.createElement('div');
            note.id = 'checkout-gameover-note';
            const won = finalScore > 2000;
            note.className = 'checkout-gameover-note' + (won ? ' is-win' : '');
            if (lang === 'en') {
              note.textContent = won
                ? 'Score over 2,000 achieved! Your ¥200 discount is being recorded below.'
                : 'Round finished! Check the panel below to watch a demo ad for another try or continue to payment.';
            } else {
              note.textContent = won
                ? '2,000点超え達成！下のパネルで200円割引が記録されます。'
                : '挑戦終了！下のパネルからデモ広告を見て再挑戦するか、お支払い設定へお進みください。';
            }
            card.appendChild(note);
          }

          notifyParent('sweetrun:game_over', { score: finalScore });
        }
      }, 250);

      // Signal readiness once React root mounts #start-btn
      const readyCheck = setInterval(() => {
        if (document.getElementById('start-btn')) {
          clearInterval(readyCheck);
          notifyParent('sweetrun:ready', {});
        }
      }, 200);
    })();
  </script>

</body>
</html>
